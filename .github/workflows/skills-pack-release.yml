# Pack skills-only zip on SemVer tags; publish GitHub Release after hard evidence
# gates and Environment "release" approval.
#
# - pack: always (tag push or dispatch) — tests + zip + workflow artifacts
# - publish: tag push, or workflow_dispatch with publish_release=true on a tag ref
#   - environment: release (required reviewers + wait timer + main/v* policies)
#   - release_evidence --mode release must pass (fail closed; no create/upload)
#   - gh release create (if missing) + upload zip / sha256 / evidence
#
# Does not create or push git tags. Does not bypass Environment protection.
name: Skills pack (tag)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer for archive name (optional leading v). Empty = derive from tag or 0.0.0-ci."
        required: false
        default: ""
      publish_release:
        description: "On a tag ref: run publish job (evidence gate + Environment release + create/upload). Default false for dispatch-only pack."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact_name: ${{ steps.ver.outputs.artifact_name }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve pack version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          TAG_NAME=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${INPUT}" ]]; then
            VER="${INPUT}"
          elif [[ -n "${TAG_NAME}" ]]; then
            VER="${TAG_NAME}"
          else
            VER="0.0.0-ci"
          fi
          NORM="${VER#v}"
          ARTIFACT="skills-pack-${NORM}"
          echo "version=${NORM}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved pack version: ${NORM}"
          echo "Artifact name: ${ARTIFACT}"
          echo "Tag name: ${TAG_NAME:-"(none)"}"

      - name: Stage skills mirrors (GOAL-022)
        run: |
          python scripts/stage_skills_mirrors.py
          python scripts/stage_skills_mirrors.py --check

      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt

      # M-001 (A-016): the L3 host-evidence ledger must match the current tree
      # before anything ships; a stale behavior source fails the pack job.
      - name: Evidence consistency gate (M-001)
        run: |
          python scripts/capture_runtime_evidence.py --check \
            --evidence-dir docs/workspace-003-mcp-file-dual-channel/GOAL-002-r1-mcp-equivalence-kernel/attachments/runtime/evidence

      - name: Run pack unit tests
        run: |
          python -m unittest discover -s scripts/tests -p 'test_pack_skills_release.py' -v
          python -m unittest discover -s scripts/tests -p 'test_pack_core_release.py' -v

      - name: Pack skills + core zips and stage bootstrap scripts
        run: |
          mkdir -p dist
          python scripts/pack_skills_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --output-dir dist
          python scripts/pack_core_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --output-dir dist
          cp scripts/bootstrap/install-online.ps1 dist/
          cp scripts/bootstrap/install-online.sh dist/
          cp scripts/bootstrap/README.md dist/bootstrap-README.md

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact_name }}
          path: |
            dist/goal-governance-skills-v*.zip
            dist/goal-governance-skills-v*.zip.sha256
            dist/goal-governance-core-v*.zip
            dist/goal-governance-core-v*.zip.sha256
            dist/install-online.ps1
            dist/install-online.sh
            dist/bootstrap-README.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (gated)
    needs: pack
    if: >
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_release == 'true' &&
       github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure annotated tag is visible
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TAG="${GITHUB_REF_NAME}"
          # Annotated tags resolve to tag objects; ^{} peels to the commit.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Missing tag ref: ${TAG}"
            exit 1
          fi
          if ! git cat-file -t "refs/tags/${TAG}" | grep -qx tag; then
            echo "Tag ${TAG} must be annotated (not lightweight) for release evidence."
            exit 1
          fi
          HEAD="$(git rev-parse HEAD)"
          TARGET="$(git rev-parse "refs/tags/${TAG}^{}")"
          if [[ "${HEAD}" != "${TARGET}" ]]; then
            echo "Checkout HEAD ${HEAD} does not match tag ${TAG} -> ${TARGET}"
            exit 1
          fi
          echo "Annotated tag ${TAG} points at HEAD ${HEAD}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt

      # Evidence gate must run on a clean tree. Download pack artifacts only after it passes
      # (untracked pack-out/ would fail `git status --short` clean-tree checks).
      - name: Hard release-evidence gate (fail closed)
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p artifacts
          # Keep generated reports outside the repo so the tree stays clean for release mode.
          REPORT_DIR="$(mktemp -d)"
          python scripts/compatibility_report.py --output "${REPORT_DIR}/compatibility-report.json"
          python scripts/release_evidence.py \
            --mode release \
            --tag "${TAG}" \
            --run-checks \
            --compatibility-report "${REPORT_DIR}/compatibility-report.json" \
            --output "${REPORT_DIR}/release-evidence.json"
          mkdir -p "${GITHUB_WORKSPACE}/../release-assets"
          cp "${REPORT_DIR}/compatibility-report.json" "${GITHUB_WORKSPACE}/../release-assets/"
          cp "${REPORT_DIR}/release-evidence.json" "${GITHUB_WORKSPACE}/../release-assets/"
          echo "ASSET_DIR=${GITHUB_WORKSPACE}/../release-assets" >> "$GITHUB_ENV"
          echo "Release evidence passed for ${TAG}"

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pack.outputs.artifact_name }}
          path: ${{ env.ASSET_DIR }}/pack-out

      # VP-004 R4: MCP server ships as a GHCR Docker image on the SAME tag and
      # version as the File assets (same workflow run, after the hard evidence
      # gate). Fixed entry: python server.py --repo-root /workspace (D-001).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP server Docker image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: mcp/
          push: true
          # F-002 (A-012): pin the effective in-image server version to the
          # pack/tag version so serverInfo.version and lifecycle writes never
          # drift from the GHCR tag.
          build-args: |
            GOAL_GOVERNANCE_MCP_VERSION=${{ needs.pack.outputs.version }}
          tags: |
            ghcr.io/magicvr/goal-governance-mcp-server:${{ needs.pack.outputs.version }}
            ghcr.io/magicvr/goal-governance-mcp-server:latest

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG}"
          EXTRA=()
          # SemVer pre-release (e.g. v1.0.0-rc.1) → mark prerelease; still gated by evidence.
          VER="${TAG#v}"
          if [[ "${VER}" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; will upload/clobber assets only."
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes \
              "${EXTRA[@]}"
            echo "Created GitHub Release ${TAG}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ROOT="${ASSET_DIR:-${GITHUB_WORKSPACE}/../release-assets}"
          mapfile -t found < <(
            find "${ROOT}" -type f \( \
              -name 'goal-governance-skills-v*.zip' -o \
              -name 'goal-governance-skills-v*.zip.sha256' -o \
              -name 'goal-governance-core-v*.zip' -o \
              -name 'goal-governance-core-v*.zip.sha256' -o \
              -name 'install-online.ps1' -o \
              -name 'install-online.sh' -o \
              -name 'bootstrap-README.md' -o \
              -name 'release-evidence.json' -o \
              -name 'compatibility-report.json' \
            \) 2>/dev/null | sort -u
          )
          if [[ ${#found[@]} -eq 0 ]]; then
            echo "No assets to upload under ${ROOT}"
            ls -laR "${ROOT}" || true
            exit 1
          fi
          # Require dual assets + digests among assets (GOAL-023)
          zip_ok=0
          sha_ok=0
          core_zip_ok=0
          core_sha_ok=0
          for f in "${found[@]}"; do
            case "$(basename "$f")" in
              goal-governance-skills-v*.zip) zip_ok=1 ;;
              goal-governance-skills-v*.zip.sha256) sha_ok=1 ;;
              goal-governance-core-v*.zip) core_zip_ok=1 ;;
              goal-governance-core-v*.zip.sha256) core_sha_ok=1 ;;
            esac
          done
          if [[ "${zip_ok}" -ne 1 || "${sha_ok}" -ne 1 ]]; then
            echo "Missing required skills zip and/or .sha256 in asset set"
            printf '%s\n' "${found[@]}"
            exit 1
          fi
          if [[ "${core_zip_ok}" -ne 1 || "${core_sha_ok}" -ne 1 ]]; then
            echo "Missing required core zip and/or .sha256 in asset set (GOAL-023)"
            printf '%s\n' "${found[@]}"
            exit 1
          fi
          gh release upload "${TAG}" "${found[@]}" --clobber
          echo "Uploaded ${#found[@]} asset(s) to release ${TAG}:"
          printf '  %s\n' "${found[@]}"
