# Pack skills-only zip on SemVer tags. Default: artifact upload only.
# Does not create tags, push remotes, or publish a GitHub Release unless the
# maintainer-authorized publish gate is explicitly enabled.
name: Skills pack (tag)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer for archive name (optional leading v). Empty = derive from tag or 0.0.0-ci."
        required: false
        default: ""
      publish_release:
        description: "If true, attach pack artifacts to an existing GitHub Release for that tag (requires contents:write and an existing release). Default false."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact_name: ${{ steps.ver.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve pack version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT}" ]]; then
            VER="${INPUT}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="0.0.0-ci"
          fi
          # Single identity for zip SemVer and workflow artifact name (strip one leading v).
          NORM="${VER#v}"
          ARTIFACT="skills-pack-${NORM}"
          echo "version=${NORM}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Resolved pack version: ${NORM}"
          echo "Artifact name: ${ARTIFACT}"

      - name: Run pack unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_pack_skills_release.py' -v

      - name: Pack skills zip
        run: |
          mkdir -p dist
          python scripts/pack_skills_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --output-dir dist

      - name: Optional compatibility + rehearsal evidence (non-blocking for pack identity)
        continue-on-error: true
        run: |
          python -m pip install -r scripts/requirements.txt -r web/requirements.txt
          mkdir -p artifacts
          python scripts/compatibility_report.py --output artifacts/compatibility-report.json
          python scripts/release_evidence.py \
            --mode rehearsal \
            --run-checks \
            --include-web \
            --compatibility-report artifacts/compatibility-report.json \
            --output artifacts/release-evidence.json

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v4
        with:
          # Must match attach-to-release download name (F-001 / A-003).
          name: ${{ steps.ver.outputs.artifact_name }}
          path: |
            dist/goal-governance-skills-v*.zip
            dist/goal-governance-skills-v*.zip.sha256
            artifacts/compatibility-report.json
            artifacts/release-evidence.json
          if-no-files-found: error

  # Maintainer-authorized gate only. Default path never reaches gh release.
  attach-to-release:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_release == 'true' &&
      github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pack artifact (same name as pack job upload)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pack.outputs.artifact_name }}
          path: pack-out

      - name: Attach assets to existing GitHub Release (explicit gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Fail closed if no release exists — do not create one here without a separate authorized process.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release for tag $TAG. Create the release as a maintainer first, then re-run with publish_release=true."
            exit 1
          fi
          mapfile -t found < <(find pack-out -type f \( -name 'goal-governance-skills-v*.zip' -o -name 'goal-governance-skills-v*.zip.sha256' -o -name 'release-evidence.json' -o -name 'compatibility-report.json' \) | sort)
          if [[ ${#found[@]} -eq 0 ]]; then
            echo "No pack assets found under pack-out"
            ls -laR pack-out || true
            exit 1
          fi
          gh release upload "$TAG" "${found[@]}" --clobber
          echo "Uploaded ${#found[@]} asset(s) to release $TAG"
