name: Skills release evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Stage skills mirrors and fail on drift
        run: |
          python scripts/stage_skills_mirrors.py
          python scripts/stage_skills_mirrors.py --check
          git diff --exit-code -- skills/core skills/contracts skills/templates || {
            echo "skills mirrors dirty after stage; commit stage output or fix canonical" >&2
            exit 1
          }
      - name: Run portable contract and bootstrap tests
        run: |
          python -m unittest skills/tests/test_skills_orchestrator.py -v
          python -m unittest discover -s docs/tests -p 'test_standalone_bootstrap.py' -v
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          git diff --check
      - name: Generate compatibility and rehearsal evidence
        run: |
          python scripts/compatibility_report.py --output artifacts/compatibility-report.json
          python scripts/release_evidence.py --mode rehearsal --run-checks --compatibility-report artifacts/compatibility-report.json --output artifacts/release-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: skills-release-evidence-ubuntu
          path: artifacts/
  windows-install-surface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Stage skills mirrors and fail on drift
        shell: pwsh
        run: |
          python scripts/stage_skills_mirrors.py
          python scripts/stage_skills_mirrors.py --check
          $changed = git diff --name-only -- skills/core skills/contracts skills/templates
          if ($changed) {
            Write-Error "skills mirrors dirty after stage; commit stage output or fix canonical"
            exit 1
          }
      - name: Run Windows installer and contract tests
        shell: pwsh
        run: |
          python -m unittest skills/tests/test_skills_orchestrator.py -v
          python -m unittest discover -s docs/tests -p 'test_standalone_bootstrap.py' -v
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          git diff --check
      - name: Generate Windows compatibility and rehearsal evidence
        shell: pwsh
        run: |
          python scripts/compatibility_report.py --output artifacts/compatibility-report-windows.json
          python scripts/release_evidence.py --mode rehearsal --run-checks --compatibility-report artifacts/compatibility-report-windows.json --output artifacts/release-evidence-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: skills-release-evidence-windows
          path: artifacts/
